name: GP 24h Reminder

on:
  schedule:
    # Controlla ogni ora — la logica interna decide se inviare
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check and send GP reminders
        env:
          SUPABASE_URL: https://sfivaxkutmgonhwjfqtx.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          NOTIFY_URL: https://fantapodio2026-rc7.vercel.app/api/notify
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, datetime, sys

          # Fetch GPS from Supabase
          req = urllib.request.Request(
            f"{__import__('os').environ['SUPABASE_URL']}/rest/v1/gps?select=id,name,date&completed=eq.false&order=date",
            headers={
              'apikey': __import__('os').environ['SUPABASE_KEY'],
              'Authorization': f"Bearer {__import__('os').environ['SUPABASE_KEY']}"
            }
          )
          gps = json.loads(urllib.request.urlopen(req).read())

          # GP start times (UTC) — 24h window
          GP_TIMES = {
            'australia': '2026-03-15T04:00:00Z', 'china': '2026-03-22T07:00:00Z',
            'japan': '2026-04-06T05:00:00Z', 'miami': '2026-05-10T19:00:00Z',
            'canada': '2026-06-14T18:00:00Z', 'monaco': '2026-05-25T13:00:00Z',
            'barcelona': '2026-06-01T13:00:00Z', 'austria': '2026-06-29T13:00:00Z',
            'britain': '2026-07-05T14:00:00Z', 'belgium': '2026-07-26T13:00:00Z',
            'hungary': '2026-08-02T13:00:00Z', 'netherlands': '2026-08-30T13:00:00Z',
            'italy': '2026-09-06T13:00:00Z', 'madrid': '2026-09-13T13:00:00Z',
            'azerbaijan': '2026-09-20T11:00:00Z', 'singapore': '2026-10-04T09:00:00Z',
            'usa': '2026-10-18T19:00:00Z', 'mexico': '2026-10-25T20:00:00Z',
            'brazil': '2026-11-08T17:00:00Z', 'lasvegas': '2026-11-21T06:00:00Z',
            'qatar': '2026-11-29T13:00:00Z', 'abudhabi': '2026-12-06T13:00:00Z',
          }

          now = datetime.datetime.utcnow()
          os = __import__('os')
          
          for gp in gps:
            start_str = GP_TIMES.get(gp['id'])
            if not start_str: continue
            start = datetime.datetime.fromisoformat(start_str.replace('Z', '+00:00')).replace(tzinfo=None)
            diff = (start - now).total_seconds()
            # Finestra: tra 23h e 25h prima del GP
            if 23 * 3600 <= diff <= 25 * 3600:
              print(f"Sending reminder for {gp['name']} — {diff/3600:.1f}h before start")
              
              # Fetch subscriptions
              req2 = urllib.request.Request(
                f"{os.environ['SUPABASE_URL']}/rest/v1/push_subscriptions?select=subscription",
                headers={'apikey': os.environ['SUPABASE_KEY'], 'Authorization': f"Bearer {os.environ['SUPABASE_KEY']}"}
              )
              subs = [row['subscription'] for row in json.loads(urllib.request.urlopen(req2).read())]
              
              if not subs:
                print("No subscriptions found")
                continue
              
              payload = json.dumps({
                'subscriptions': subs,
                'title': f'🏎️ {gp["name"]} — 24 ore al via!',
                'body': 'Non dimenticare di inviare il tuo pronostico prima della partenza!',
                'tag': 'gp-reminder',
                'requireInteraction': True,
              }).encode()
              
              req3 = urllib.request.Request(
                os.environ['NOTIFY_URL'],
                data=payload,
                headers={
                  'Content-Type': 'application/json',
                  'x-notify-secret': os.environ['NOTIFY_SECRET'],
                },
                method='POST'
              )
              resp = urllib.request.urlopen(req3)
              print(f"Sent: {resp.read().decode()}")
              break
          else:
            print("No GP reminder needed at this time")
          PYEOF
